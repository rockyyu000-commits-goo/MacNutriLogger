<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MacNutriLogger admin</title>
<meta name="theme-color" content="#7a003c">
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">
<header class="topbar">
  <div class="topbar-in">
    <span class="brand">MacNutri</span>
    <h1>Menu admin</h1>
    <a class="topbar-link" href="/">Back to app</a>
  </div>
</header>
<main id="admin">
  <section class="card pad" id="auth">
    <label class="field"><span>Admin token <span class="muted">(the ADMIN_TOKEN the server was started with)</span></span>
      <input type="password" id="token" autocomplete="off" spellcheck="false"></label>
    <p class="muted" id="auth-status">Enter the token to make changes.</p>
  </section>

  <section>
    <header class="section-head"><h2>Places</h2><span class="muted" id="counts"></span></header>
    <div class="admin-bar">
      <input type="search" id="loc-filter" placeholder="Filter places" autocomplete="off">
      <label class="inline"><input type="checkbox" id="flagged-only"> only places with flagged items</label>
      <button type="button" class="btn" id="new-loc">New place</button>
    </div>
    <ul class="list card" id="locs"></ul>
  </section>

  <section id="editor" hidden></section>

  <section>
    <header class="section-head"><h2>Bulk import</h2></header>
    <div class="card pad">
      <p class="muted">Paste <code>{"locations":[…],"items":[…]}</code>, for example transcribed from menu photos. Records with an existing id are replaced.</p>
      <textarea id="json" rows="8" spellcheck="false" placeholder='{"locations":[{"name":"Subway"}],"items":[{"locationId":"subway","name":"Turkey 6in","serving":"6 in","calories":280,"protein":18,"carbs":46,"fat":3.5,"source":"photo"}]}'></textarea>
      <div class="actions start">
        <button type="button" class="btn primary grow0" id="import">Import</button>
        <button type="button" class="btn" id="export">Download all menu data</button>
      </div>
    </div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
